name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Lint, build dbt (DuckDB), and run tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: "Lint with ruff"
        run: ruff check .

      - name: "Sanity-check synthetic data generator is deterministic"
        run: python -m data_generator.generate --out /tmp/rmc_seed_check

      - name: "dbt build (DuckDB target)"
        working-directory: dbt/retail_margin_cockpit
        env:
          DBT_PROFILES_DIR: .
          RMC_DUCKDB_PATH: /tmp/rmc_ci.duckdb
        run: dbt build --target duckdb

      - name: "Run test suite"
        run: python -m pytest -q
